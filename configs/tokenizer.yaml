# 32k English BPE
# Mirrors the pretraining mix in spirit (edu web + textbooks + chat), plus
# small code + math doses so BPE learns merges for brackets, indentation,
# and digits. smollm-corpus/cosmopedia-v2 is intentionally omitted: it
# overlaps heavily with cosmopedia/web_samples_v2.
vocab_size: 32000
sources:
  - hf: HuggingFaceFW/fineweb-edu
    field: text
    n: 400000
  - hf: HuggingFaceTB/cosmopedia
    name: web_samples_v2
    field: text
    n: 150000
  - hf: HuggingFaceTB/smoltalk
    name: everyday-conversations
    fallbacks: [smol-magpie-ultra, long-conversations, all]
    field: messages
    n: 50000
  - hf: bigcode/starcoderdata
    name: default
    field: content
    n: 30000
  - hf: open-web-math/open-web-math
    field: text
    n: 30000
out: tokenizer/
